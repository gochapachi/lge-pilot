<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>GTM Control Tower</title>
<style>
/* LGE design system v0.5 — Linear-derived: darkness as native medium.
   Surfaces step in luminance (transparent white), borders whisper, one accent. */
:root{
  --bg:#0b0d10; --panel:#101216; --card:rgba(255,255,255,.03); --card2:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --txt:#f7f8f8; --txt2:#d0d6e0; --mut:#8a8f98; --mut2:#62666d;
  --acc:#7170ff; --acc2:#828fff; --acc-dim:rgba(113,112,255,.12);
  --ok:#2fbf71; --warn:#f5a623; --bad:#ff5c5c; --hot:#ff7a45;
  --header-h:56px; --radius:10px; --radius-lg:14px;
  --shadow-1:0 0 0 1px rgba(255,255,255,.04);
  --shadow-2:0 8px 24px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.05);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;
padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--acc2);text-decoration:none}
h1{font-size:1.1rem}h2{font-size:1rem;margin-bottom:10px}h3{font-size:.85rem}
/* ---------- header ---------- */
.top{position:sticky;top:0;height:var(--header-h);background:rgba(11,14,20,.92);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;z-index:20}
.brand{font-weight:700;letter-spacing:.02em;white-space:nowrap}
.conn-dot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
.conn-dot.ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.conn-dot.bad{background:var(--bad)}
.topmain{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut);font-size:.9rem}
/* ---------- nav ---------- */
.topnav{display:none;gap:2px}
.topnav button{background:none;border:none;color:var(--mut);font-size:.85rem;padding:8px 12px;cursor:pointer;border-radius:9px;white-space:nowrap}
.topnav button.on{color:#fff;background:var(--card2)}
.topnav button:hover{color:var(--txt)}
.tabs{display:flex;gap:2px;position:fixed;bottom:0;left:0;right:0;background:var(--card);
border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;background:none;border:none;color:#9fabc0;font-size:.65rem;padding:5px 2px;cursor:pointer;border-radius:9px;white-space:nowrap}
.tabs button .ti{display:block;font-size:1.05rem;line-height:1.25}
.tabs button.on{color:var(--acc2);background:var(--card2)}
@media(min-width:768px){
  body{padding-bottom:0}
  .tabs{display:none}
  .topnav{display:flex}
  .topmain{font-size:.85rem}
}
/* ---------- layout ---------- */
main{padding:14px 14px;max-width:1100px;margin:0 auto}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.kpi b{font-size:1.45rem;display:block;line-height:1.2}
.kpi span{color:var(--mut);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.7rem;border:1px solid var(--line);white-space:nowrap}
.p-new{color:#9aa7bd}.p-contacted{color:#7fb3ff;border-color:#2c4a80}.p-replied{color:#ffd479;border-color:#6b5a24}
.p-probing{color:#ffb36b;border-color:#6e4a26}.p-demo_sent{color:#c792ea;border-color:#5b3a73}
.p-negotiating{color:#82e0aa;border-color:#2e6b45}.p-followup{color:#8fd3ff;border-color:#2b5a78}
.p-closed_won{color:#2ecc71;border-color:#1d7a44}.p-closed_lost{color:#ff8080;border-color:#7a2e2e}
/* ---------- tables ---------- */
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
.tbl table{min-width:520px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{color:var(--mut);text-align:left;font-weight:500;padding:7px 8px;border-bottom:1px solid var(--line);
position:sticky;top:var(--header-h);background:var(--card);z-index:2}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click:hover{background:var(--card2);cursor:pointer}
/* ---------- controls ---------- */
button,.btn{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;
padding:10px 14px;cursor:pointer;font-size:.9rem;min-height:40px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:active{filter:brightness(.9)}
button.danger{border-color:#7a2e2e;color:#ff8080}
button.sm{padding:5px 10px;font-size:.78rem;min-height:32px}
input,select,textarea{background:#0f1523;border:1px solid var(--line);color:var(--txt);border-radius:10px;
padding:10px 12px;font-size:16px;width:100%;min-height:42px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,140,255,.18)}
textarea{min-height:74px;resize:vertical;font-size:.9rem}
label{display:block;color:var(--mut);font-size:.75rem;margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.row.wrap{flex-wrap:wrap}
.row.wrap>*{flex:1 1 140px}
/* ---------- chat / drawer ---------- */
.chat{display:flex;flex-direction:column;gap:4px;max-height:46vh;overflow-y:auto;padding:6px 2px}
.msg{max-width:84%;padding:7px 11px;border-radius:14px;font-size:.88rem;white-space:pre-wrap;overflow-wrap:break-word}
.msg.out{align-self:flex-end;background:#1f3a63}
.msg.in{align-self:flex-start;background:var(--card2)}
.msg .t{display:block;font-size:.62rem;color:var(--mut);margin-top:2px}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:none}
.drawer{position:fixed;z-index:40;background:var(--card);overflow-y:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));
transform:translateY(105%);transition:transform .22s ease;
left:0;right:0;bottom:0;max-height:92dvh;border-radius:18px 18px 0 0;border-top:1px solid var(--line)}
.drawer.open{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 10px}
@media(min-width:768px){
  .drawer{top:0;right:0;bottom:auto;left:auto;width:min(500px,46vw);max-height:100dvh;
  border-radius:0;border-left:1px solid var(--line);transform:translateX(105%)}
  .drawer.open{transform:none}
  .grab{display:none}
}
.esc{border-left:3px solid var(--bad);padding-left:10px;margin-bottom:10px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
background:var(--acc);color:#fff;padding:10px 18px;border-radius:12px;z-index:99;display:none;font-size:.85rem;
max-width:92vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.mut{color:var(--mut)}.sm{font-size:.78rem}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.hide{display:none!important}
/* v0.4.4 polish */
.switch .slider{position:absolute;cursor:pointer;inset:0;background:var(--line);border-radius:99px;transition:.2s}
.switch .slider:before{content:'';position:absolute;width:16px;height:16px;border-radius:50%;left:3px;top:3px;background:#fff;transition:.2s}
.switch input:checked + .slider{background:var(--ok)}
.switch input:checked + .slider:before{transform:translateX(18px)}
.pill.p-closed_won,.pill.p-active{box-shadow:none}
.drawer h2{display:flex;align-items:center;gap:8px}
.msg{line-height:1.45}
@media(max-width:767px){.msg{max-width:88%}}
.empty{padding:26px 14px;text-align:center;color:var(--mut)}
.empty .e{font-size:1.9rem;display:block;margin-bottom:6px}
.empty .pri{margin-top:12px}
code{background:var(--card2);border-radius:6px;padding:1px 6px;font-size:.82em;overflow-wrap:anywhere}
.chip{display:inline-flex;gap:5px;align-items:center;background:var(--card2);border:1px solid var(--line);
border-radius:99px;padding:4px 11px;font-size:.75rem;margin:2px 4px 2px 0}
.moremenu a{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:var(--card2);
border:1px solid var(--line);margin-bottom:8px;color:var(--txt);font-size:.95rem}
.moremenu a .mi{font-size:1.2rem}
.statrow{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);
border-radius:12px;padding:12px;margin:10px 0;flex-wrap:wrap}
.pipewrap{overflow-x:auto;margin-bottom:12px;-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent)}
.pipewrap::-webkit-scrollbar{display:none}
.pipe{display:flex;gap:8px;min-width:max-content}
.pipe a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;text-align:center;min-width:86px}
.pipe a b{display:block;font-size:1.15rem}
.pipe a span{font-size:.68rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
/* ---------- agentic CRM ---------- */
.ai{border:1px solid #2b4a7a;background:linear-gradient(180deg,rgba(79,140,255,.09),rgba(79,140,255,.02));
border-radius:var(--radius);padding:12px;margin:10px 0}
.ai .aihead{display:flex;align-items:center;gap:8px}
.ai .aihead b{font-size:.85rem;flex:1}
.switch{position:relative;width:40px;height:22px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.switch i:before{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.switch input:checked+i{background:var(--ok)}
.switch input:checked+i:before{transform:translateX(18px)}
.act-ic{display:inline-block;width:22px;text-align:center}
.fab{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));border-radius:99px;
padding:14px 22px;z-index:15;box-shadow:0 8px 22px rgba(0,0,0,.45);font-weight:600}
@media(min-width:768px){.fab{bottom:28px;right:28px}}

/* ===== v0.5 Linear-pass ===== */
*{font-feature-settings:'cv01','ss03'}
body{font-family:var(--font);font-weight:400;letter-spacing:-.011em}
h1,h2{font-weight:590;letter-spacing:-.24px}
h3,.kpi b{font-weight:590}
.card{box-shadow:var(--shadow-1);transition:background .15s ease,border-color .15s ease}
.card.click:hover{background:var(--card2);border-color:var(--line2);cursor:pointer}
.card.click:active{background:rgba(255,255,255,.075)}
button{font-weight:510;border-radius:8px}
button:not(.pri):not(.danger){background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--txt2)}
button:not(.pri):not(.danger):hover{background:rgba(255,255,255,.07);color:var(--txt)}
button.pri{background:var(--acc);border:1px solid transparent;font-weight:590}
button.pri:hover{background:var(--acc2)}
button.sm{border-radius:7px}
input,select,textarea{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;
  font-weight:400;transition:border-color .15s ease,box-shadow .15s ease}
input:focus,select,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-dim)}
.pill{font-weight:510;border-radius:99px;padding:2.5px 10px}
.pill.p-closed_won{background:rgba(47,191,113,.14)}
.tabs{backdrop-filter:blur(14px);background:rgba(13,15,18,.82)}
.tabs button{font-weight:510;letter-spacing:.01em}
.tabs button.on{color:var(--acc2);background:var(--acc-dim);border-radius:10px}
.topnav button{font-weight:510;border-radius:8px}
.topnav button.on{background:var(--acc-dim);color:#fff}
.topnav button:hover{color:var(--txt2)}
.kpi b{font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi span{font-weight:510}
.msg{font-weight:400}
.msg.out{background:linear-gradient(180deg,rgba(113,112,255,.24),rgba(113,112,255,.16));
  border:1px solid rgba(113,112,255,.28)}
.msg.in{background:rgba(255,255,255,.05);border:1px solid var(--line)}
.pill.p-new{color:var(--mut)}
.pill.p-contacted{color:#9db4ff;border-color:rgba(113,112,255,.32)}
.pill.p-replied{color:#ffd479;border-color:rgba(245,166,35,.3)}
.pill.p-probing{color:#ffb36b;border-color:rgba(255,122,69,.3)}
.pill.p-demo_sent{color:#c9b5ff;border-color:rgba(122,120,255,.32)}
.pill.p-negotiating{color:#82e0aa;border-color:rgba(47,191,113,.3)}
.pipe a{background:var(--card);border:1px solid var(--line);border-radius:10px}
.chip{background:var(--card);border-radius:99px;font-weight:510}
.statrow{background:var(--card);border:1px solid var(--line);border-radius:12px}
.ai{border:1px solid rgba(113,112,255,.25);background:linear-gradient(180deg,rgba(113,112,255,.10),rgba(113,112,255,.03))}
.empty .e{opacity:.75}
.top{background:rgba(11,13,16,.88)}
.drawer{background:var(--panel);box-shadow:0 -12px 40px rgba(0,0,0,.5)}
@media(min-width:768px){.drawer{box-shadow:-12px 0 40px rgba(0,0,0,.5)}}
.fab{background:var(--acc);font-weight:590;box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 0 1px rgba(113,112,255,.4)}
.fab:hover{background:var(--acc2)}
.tbl th{background:var(--panel);font-weight:510}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <span class="conn-dot" id="conn"></span>
  <h1 class="brand">LGE</h1>
  <nav class="topnav" id="topnav"></nav>
  <span class="topmain" id="title"></span>
</header>
<main id="app"></main>
<div class="backdrop" id="backdrop" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>
<nav class="tabs" id="tabs"></nav>

<script>
/* ================= config (pre-configured, zero setup) ================= */
const VER="v0.5.0";
const LS=window.localStorage;
const DEFAULT_URL=location.origin+'/api';
const cfg={
  get url(){return LS.getItem('sb_url')||DEFAULT_URL},
  get key(){return LS.getItem('sb_key')||'lge'},
  get bridge(){return LS.getItem('bridge_url')||''},
  set(k,v){v?LS.setItem(k,v):LS.removeItem(k)}
};
const API_BASE=()=>cfg.url.includes('supabase')?cfg.url.replace(/\/+$/,'')+'/rest/v1':cfg.url.replace(/\/+$/,'');
const IS_SB=()=>cfg.url.includes('supabase');
const AUTH=()=>IS_SB()?{'apikey':cfg.key,'Authorization':'Bearer '+cfg.key}:{};
async function sb(path,opts={}){
  const r=await fetch(`${API_BASE()}/${path}`,{...opts,
    headers:{...AUTH(),'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})}});
  if(!r.ok) throw new Error((await r.text()).slice(0,200));
  const t=await r.text();return t?JSON.parse(t):null;
}
const rpc=async(fn,args)=>{const r=await fetch(`${API_BASE()}/rpc/${fn}`,{method:'POST',
  headers:{...AUTH(),'Content-Type':'application/json'},body:JSON.stringify(args)});
  if(!r.ok) throw new Error((await r.text()).slice(0,200));const t=await r.text();return t?JSON.parse(t):null};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._tm);t._tm=setTimeout(()=>t.style.display='none',2600)}
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Date(n).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const INR=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const empty=(e,t,cta='')=>`<div class="empty"><span class="e">${e}</span>${t}${cta}</div>`;
const v=id=>document.getElementById(id)?.value;
const waLink=p=>{let d=(p||'').replace(/\D/g,'');if(d.length===10)d='91'+d;if(d.startsWith('0'))d='91'+d.slice(1);return d?'https://wa.me/'+d:''};

/* ================= router ================= */
const NAV=[['today','🧭','Today'],['sales','💰','Sales'],['inbox','💬','Inbox'],['delivery','📦','Delivery'],
  ['esc','🚨','Escalations'],['vault','🔐','Vault'],['analytics','📈','Analytics'],['conn','⚙️','Connection']];
const MOBILE_TABS=[['today','🧭','Today'],['sales','💰','Sales'],['inbox','💬','Inbox'],['analytics','📈','Analytics'],['more','⋯','More']];
let tab='today'; if(location.hash.includes('portal')) tab='PORTAL';
else{const h0=location.hash.replace('#','');if(h0&&NAV.some(n=>n[0]===h0))tab=h0}
const stageOrder=['new','contacted','replied','probing','demo_sent','negotiating','followup','closed_won','closed_lost'];
const stageLabel=s=>s.replace('_',' ');
function renderNav(){
  const on=id=>tab===id?'on':'';
  document.getElementById('topnav').innerHTML=NAV.map(([id,i,l])=>`<button class="${on(id)}" onclick="go('${id}')">${i} ${l}</button>`).join('');
  document.getElementById('tabs').innerHTML=MOBILE_TABS.map(([id,i,l])=>
    `<button class="${on(id)}" onclick="go('${id}')"><span class="ti">${i}</span>${l}</button>`).join('');
}
function go(t){tab=t;renderNav();closeDrawer();render()}
window.go=go;

/* ================= connection status ================= */
async function pingAPI(){
  const t0=performance.now();
  await sb('leads?select=id&limit=1');
  return Math.round(performance.now()-t0);
}
function setConn(state){const d=document.getElementById('conn');d.className='conn-dot '+(state||'')}
async function autoPing(){try{const ms=await pingAPI();setConn('ok');return ms}catch(e){setConn('bad');return null}}

/* ================= TODAY ================= */
async function loadToday(){
  const [escs,tiks,follows,evs,pipeline,autopilot]=await Promise.all([
    sb('escalations?select=*&status=eq.open&order=created_at.desc'),
    sb('tickets?select=*&status=in.(open,in_progress)&order=sla_due.asc'),
    sb('leads?select=*&stage=in.(contacted,replied,probing,demo_sent,negotiating)&next_action_at=not.is.null&order=next_action_at.asc&limit=20'),
    sb('events?select=*&order=created_at.desc&limit=15'),
    sb('crm_lead?select=stage').catch(()=>[]),
    sb('crm_lead?select=id,next_action_at&autopilot=eq.true').catch(()=>[])]);
  const auto=autopilot||[];
  const ISO0=new Date().setHours(0,0,0,0);
  const msgsToday=await sb(`messages?select=id,direction,created_at&created_at=gte.${new Date(ISO0).toISOString()}`).catch(()=>[]);
  const pays=await sb('payments?select=amount,status&created_at=gte.'+new Date(ISO0).toISOString()).catch(()=>[]);
  const paidToday=pays.filter(p=>p.status==='paid').reduce((s,p)=>s+ +p.amount,0);
  const sentToday=msgsToday.filter(m=>m.direction==='out').length;
  const inToday=msgsToday.filter(m=>m.direction==='in').length;
  const dueLeads=follows.filter(l=>new Date(l.next_action_at)<=new Date());
  const pc={};pipeline.forEach(r=>pc[r.stage]=(pc[r.stage]||0)+1);
  return {escs,tiks,follows,evs,dueLeads,sentToday,inToday,paidToday,pc,pipelineTotal:pipeline.length,auto,
    autoDue:auto.filter(l=>l.next_action_at&&new Date(l.next_action_at)<=new Date()).length};
}
async function viewToday(){
  const d=await loadToday();setConn('ok');
  const chip=(st,label)=>`<a onclick="go('sales')"><b>${d.pc[st]||0}</b><span>${label}</span></a>`;
  return `
  <div class="kpis">
    <div class="card kpi"><b>${d.pipelineTotal||0}</b><span>pipeline leads</span></div>
    <div class="card kpi"><b>${d.sentToday}</b><span>msgs sent</span></div>
    <div class="card kpi"><b>${d.inToday}</b><span>replies in</span></div>
    <div class="card kpi"><b class="${d.paidToday?'ok':''}">${INR(d.paidToday)}</b><span>paid today</span></div>
  </div>
  <div class="pipewrap"><div class="pipe">
    ${chip('new','new')}${chip('contacted','contacted')}${chip('replied','replied')}${chip('probing','probing')}
    ${chip('demo_sent','demo sent')}${chip('negotiating','negotiating')}${chip('closed_won','won ✦')}${chip('followup','follow-up')}
  </div></div>
  <div class="statrow"><span style="font-size:1.3rem">🤖</span>
    <div style="flex:1;min-width:140px"><b class="sm">${d.auto.length} ${d.auto.length===1?'lead':'leads'} on autopilot</b>
      <div class="sm mut">${d.autoDue} due now — AI acts per your steering</div></div>
    <button class="sm" onclick="go('sales')">review</button></div>
  <div class="grid g2">
    <div class="card"><h2>⏰ Follow-ups due (${d.dueLeads.length})</h2>

  const msg={lead_id:id,direction:'out',kind:'text',chunks,status:cfg.bridge?'queued':'sent'};
  const [m]=await sb('messages',{method:'POST',body:JSON.stringify(msg)});
  if(cfg.bridge){try{await fetch(cfg.bridge,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({type:'send_chunks',lead_id:id,messages:chunks,message_id:m.id})});toast('→ bridge')}catch(e){toast('bridge fail: saved as queued')}}
  else toast('saved (bridge not set)');

/* ================= VAULT ================= */
async function getPk(pass,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function encSecret(txt,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await getPk(pass,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(txt));
  return `v1:${b64(salt)}:${b64(iv)}:${b64(ct)}`;
}
async function decSecret(blob,pass){
  const [_,s,iv,ct]=blob.split(':');
  const k=await getPk(pass,ub64(s));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(iv)},k,ub64(ct));
  return new TextDecoder().decode(pt);
}

  return `<div class="grid g2"><div class="card"><h2>Add credential</h2>
    <label>Client</label><select id="vc_client">${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
    <label>Label <span class="sm">(e.g. "WordPress admin")</span></label><input id="vc_label">
    <label>Secret</label><input id="vc_secret" type="password">

    <button class="pri" style="margin-top:10px;width:100%" onclick="saveCred()">Encrypt & save</button>
    <p class="sm mut" style="margin-top:8px">AES-GCM in your browser. DB only holds ciphertext; passphrase never leaves this device.</p></div>
  <div class="card"><h2>Saved (${vs.length})</h2>
   ${vs.map(x=>`<div class="row sm" style="margin:6px 0;padding:8px;background:var(--card2);border-radius:8px">
     <div style="flex:2">🔒 ${esc(x.label)} <span class="mut">· ${esc(cs.find(c=>c.id===x.client_id)?.name||'—')}</span></div>

async function render(){
  const labels={today:'Today',sales:'Sales',inbox:'Inbox',delivery:'Delivery',esc:'Escalations',vault:'Vault',analytics:'Analytics',conn:'Connection',more:'More',PORTAL:'Client Portal'};
  document.getElementById('title').textContent=labels[tab]||'GTM Control Tower';

  if(tab==='PORTAL')return renderPortal();
  try{
    app.innerHTML='<p class="mut" style="padding:20px 0">loading…</p>';
    app.innerHTML=await({today:viewToday,sales:viewSales,inbox:viewInbox,delivery:viewDelivery,esc:viewEsc,vault:viewVault,analytics:viewAnalytics,conn:viewConn,more:viewMore}[tab]||viewToday)();
    if(tab!=='conn')autoPing();
  }catch(e){
    setConn('bad');
    const msg=(e.message||'').trim().startsWith('{')?'API error — check Connection tab':e.message;
    app.innerHTML=`<div class="card"><h2>⚠️ ${esc(msg)}</h2>

       <button class="pri" onclick="render()">Retry</button>
