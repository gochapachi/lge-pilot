<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GTM Control Tower</title>
<style>
:root{--bg:#0b0e14;--card:#141926;--card2:#1a2133;--line:#242d42;--txt:#e6ebf4;--mut:#8b95a9;--acc:#4f8cff;--ok:#2ecc71;--warn:#f5a623;--bad:#ff5c5c;--hot:#ff7a45}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:70px}
a{color:var(--acc);text-decoration:none}
h1{font-size:1.3rem}h2{font-size:1.05rem;margin-bottom:10px}
.top{position:sticky;top:0;background:rgba(11,14,20,.95);backdrop-filter:blur(6px);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:10}
.tabs{display:flex;gap:4px;overflow-x:auto;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px;z-index:10}
.tabs button{flex:1;background:none;border:none;color:var(--mut);font-size:.68rem;padding:6px 2px;cursor:pointer;border-radius:8px;white-space:nowrap}
.tabs button.on{color:var(--acc);background:var(--card2)}
main{padding:14px 16px;max-width:1100px;margin:0 auto}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:1.6rem}
.kpi span{color:var(--mut);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.7rem;border:1px solid var(--line)}
.p-new{color:#9aa7bd}.p-contacted{color:#7fb3ff;border-color:#2c4a80}.p-replied{color:#ffd479;border-color:#6b5a24}.p-probing{color:#ffb36b;border-color:#6e4a26}.p-demo_sent{color:#c792ea;border-color:#5b3a73}.p-negotiating{color:#82e0aa;border-color:#2e6b45}.p-closed_won{color:#2ecc71;border-color:#1d7a44}.p-closed_lost{color:#ff8080;border-color:#7a2e2e}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{color:var(--mut);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:52px;background:var(--card)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click:hover{background:var(--card2);cursor:pointer}
button,.btn{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:.85rem}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{border-color:#7a2e2e;color:#ff8080}
button.sm{padding:4px 9px;font-size:.75rem}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 11px;font-size:.9rem;width:100%}
textarea{min-height:70px;resize:vertical}
label{display:block;color:var(--mut);font-size:.75rem;margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.chat{display:flex;flex-direction:column;gap:3px;max-height:45vh;overflow-y:auto;padding:6px 2px}
.msg{max-width:82%;padding:7px 11px;border-radius:14px;font-size:.88rem;white-space:pre-wrap}
.msg.out{align-self:flex-end;background:#1f3a63}
.msg.in{align-self:flex-start;background:var(--card2)}
.msg .t{display:block;font-size:.62rem;color:var(--mut);margin-top:2px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--card);border-left:1px solid var(--line);z-index:30;overflow-y:auto;padding:16px;transform:translateX(100%);transition:.2s}
.drawer.open{transform:none}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25;display:none}
.esc{border-left:3px solid var(--bad);padding-left:10px;margin-bottom:10px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;padding:10px 18px;border-radius:12px;z-index:99;display:none;font-size:.85rem}
.mut{color:var(--mut)}.sm{font-size:.78rem}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
canvas{max-width:100%}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top"><h1 id="title">GTM Control Tower</h1><span class="sm mut" id="conn"></span></div>
<main id="app"></main>
<div class="backdrop" id="backdrop" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>
<nav class="tabs" id="tabs"></nav>

<script>
/* ============ config (localStorage) ============ */
const LS=window.localStorage;
const cfg={
  get url(){return LS.getItem('sb_url')||''},
  get key(){return LS.getItem('sb_key')||''},
  get bridge(){return LS.getItem('bridge_url')||''},
  set(k,v){LS.setItem(k,v)}
};
async function sb(path,opts={},q=''){
  const r=await fetch(`${cfg.url}/rest/v1/${path}${q}`,{...opts,
    headers:{'apikey':cfg.key,'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})}});
  if(!r.ok) throw new Error((await r.text()).slice(0,300));
  const t=r.text();return t?JSON.parse(t):null;
}
const rpc=async(fn,args)=>{const r=await fetch(`${cfg.url}/rest/v1/rpc/${fn}`,{method:'POST',
  headers:{'apikey':cfg.key,'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json'},body:JSON.stringify(args)});
  if(!r.ok) throw new Error((await r.text()).slice(0,300));const t=await r.text();return t?JSON.parse(t):null};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Date(n).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const fmtD=n=>new Date(n).toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
const INR=n=>'₹'+Number(n).toLocaleString('en-IN');

/* ============ router ============ */
const TABS=[['today','🧭 Today'],['sales','💰 Sales'],['inbox','💬 Inbox'],['delivery','📦 Delivery'],['esc','🚨 Escalations'],['vault','🔐 Vault'],['analytics','📈 Analytics'],['settings','⚙️']];
let tab='today'; if(location.hash.includes('portal')) tab='PORTAL';
const stageOrder=['new','contacted','replied','probing','demo_sent','negotiating','closed_won','closed_lost'];
const stageLabel=s=>s.replace('_',' ');
function renderTabs(){document.getElementById('tabs').innerHTML=TABS.map(([id,l])=>
  `<button class="${tab===id?'on':''}" onclick="go('${id}')">${l}</button>`).join('')}
function go(t){tab=t;renderTabs();render();if(t==='PORTAL')renderPortal()}
window.go=go;

/* ============ TODAY ============ */
async function loadToday(){
  const [escs,tiks,follows,evs,leads]=await Promise.all([
    sb('escalations?select=*&status=open&order=created_at.desc'),
    sb('tickets?select=*&status=in(open,in_progress)&order=sla_due.asc'),
    sb('leads?select=*&stage=in(contacted,replied,probing,demo_sent,negotiating)&next_action_at=not.is.null&order=next_action_at.asc&limit=20'),
    sb('events?select=*&order=created_at.desc&limit=15'),
    sb('leads?select=id,is_test')]);
  const today=new Date().toDateString();
  const msgsToday=await sb(`messages?select=id,direction,constitution=created_at&created_at=gte.${new Date().setHours(0,0,0,0)}`).catch(()=>[]);
  const pays=await sb('payments?select=amount,status&created_at=gte.'+new Date().setHours(0,0,0,0)).catch(()=>[]);
  const paidToday=pays.filter(p=>p.status==='paid').reduce((s,p)=>s+ +p.amount,0);
  const sentToday=(msgsToday||[]).filter(m=>m.direction==='out').length;
  const inToday=(msgsToday||[]).filter(m=>m.direction==='in').length;
  const dueLeads=leads.filter(l=>new Date(l.next_action_at)<=new Date());
  return {escs,tiks,follows,evs,dueLeads,sentToday,inToday,paidToday};
}
async function viewToday(){
  const d=await loadToday();
  document.getElementById('conn').textContent='supabase ✓';
  return `
  <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">
    <div class="card kpi"><b>${d.sentToday}</b><span>msgs sent</span></div>
    <div class="card kpi"><b>${d.inToday}</b><span>replies in</span></div>
    <div class="card kpi"><b class="${d.paidToday?'ok':''}">${INR(d.paidToday)}</b><span>paid today</span></div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>⏰ Follow-ups due (${d.dueLeads.length})</h2>
      ${d.dueLeads.map(l=>`<div class="row" style="margin:6px 0"><div class="click" onclick="openLead('${l.id}')" style="flex:2">${esc(l.business||l.name)} <span class="pill p-${l.stage}">${stageLabel(l.stage)}</span></div><button class="sm" onclick="snooze('${l.id}',1)">+1h</button><button class="sm pri" onclick="go('inbox');openLead('${l.id}')">Chat</button></div>`).join('')||'<span class="mut sm">Nothing due 🎉</span>'}</div>
    <div class="card"><h2>🚨 Escalations (${d.escs.length})</h2>
      ${d.escs.slice(0,5).map(e=>`<div class="esc sm"><b>${esc(e.reason)}</b> — ${esc(e.detail||'')} <a onclick="go('esc')">open →</a></div>`).join('')||'<span class="mut sm">None open</span>'}</div>
    <div class="card"><h2>🎫 Tickets (${d.tiks.length})</h2>
      ${d.tiks.slice(0,5).map(t=>`<div class="sm" style="margin:6px 0">[${esc(t.priority)}] ${esc(t.title)} <span class="mut">SLA ${fmt(t.sla_due)}</span></div>`).join('')||'<span class="mut sm">None</span>'}</div>
    <div class="card"><h2>🧵 Latest events</h2>${d.evs.map(e=>`<div class="sm mut">${fmt(e.created_at)} — ${esc(e.type)} ${esc(e.payload?.text||'')}</div>`).join('')}</div>
  </div>`;
}

/* ============ SALES ============ */
async function viewSales(){
  const leads=await sb('leads?select=*&order=updated_at.desc&limit=200');
  window._leads=Object.fromEntries(leads.map(l=>[l.id,l]));
  return ['new','contacted','replied','probing','demo_sent','negotiating','closed_won','closed_lost'].map(st=>{
    const ls=leads.filter(l=>l.stage===st);
    if(['closed_won','closed_lost'].includes(st)&&!ls.length)return'';
    return `<h2 style="margin:14px 0 8px">${stageLabel(st)} <span class="mut sm">(${ls.length})</span></h2>
    ${ls.map(l=>`<div class="card click" style="margin-bottom:8px" onclick="openLead('${l.id}')">
      <div class="row"><b style="flex:2">${esc(l.business||l.name)}${l.is_test?' 🧪':''}</b><span class="pill p-${l.stage}">${stageLabel(l.stage)}</span><span class="${l.score>60?'hot':l.score>30?'warn':'mut'} sm">🔥${l.score}</span></div>
      ${l.next_action?`<div class="sm mut">next: ${esc(l.next_action)} @ ${fmt(l.next_action_at)}</div>`:''}</div>`).join('')}`;
  }).join('')+`<div style="margin:20px 0"><button class="pri" onclick="newLeadForm()">+ New lead</button></div>`;
}
function newLeadForm(){
  openDrawer(`<h2>New lead</h2>
  <label>Business</label><input id="nl_b"><label>Person</label><input id="nl_n">
  <label>Niche</label><input id="nl_k" value="dentist"><label>Phone</label><input id="nl_p">
  <div style="margin-top:14px"><button class="pri" onclick="saveLead()">Save</button></div>`);
}
async function saveLead(){
  const b=v('nl_b'),n=v('nl_n'),p=v('nl_p');
  const [l]=await sb('leads',{method:'POST',body:JSON.stringify({business:b,name:n,phone:p,source:'manual'})});
  await sb('events',{method:'POST',body:JSON.stringify({type:'lead_created',lead_id:l.id,payload:{text:b}})});
  toast('_lead created');closeDrawer();go('sales');render();
}
async function openLead(id){
  const l=(window._leads||await leadMap())[id]; if(!l)return;
  const [msgs,demos,pays,out]=await Promise.all([
    sb(`messages?lead_id=eq.${id}&order=created_at.asc&limit=100`),
    sb(`demos?lead_id=eq.${id}&order=sent_at.desc`),
    sb(`payments?lead_id=eq.${id}&order=created_at.desc`),
    sb(`outreach_log?lead_id=eq.${id}&order=created_at.desc&limit=10`)]);
  window._leadId=id;
  openDrawer(`
   <div class="row"><h2>${esc(l.business||l.name)}</h2><button class="sm" onclick="closeDrawer()">✕</button></div>
   <div class="row sm" style="margin:8px 0">
     <select id="st_move" onchange="moveStage('${id}')">${stageOrder.map(s=>`<option ${s===l.stage?'selected':''}>${s}</option>`).join('')}</select>
     <span class="pill p-${l.stage}">${stageLabel(l.stage)}</span></div>
   <div class="sm mut">${esc(l.niche||'')} · ${esc(l.city||'')} · ${esc(l.phone||'no phone')} · src:${esc(l.source)}</div>
   ${l.notes?`<div class="sm" style="margin:8px 0">📝 ${esc(l.notes)}</div>`:''}
   <label>Next action</label>
   <div class="row"><input id="na_txt" value="${esc(l.next_action||'')}" placeholder="e.g. send custom demo">
   <input id="na_when" type="datetime-local" value="${l.next_action_at?new Date(new Date(l.next_action_at)-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):''}" style="max-width:200px">
   <button class="sm pri" onclick="saveNext('${id}')">↩</button></div>
   <h2 style="margin-top:16px">Chat</h2>
   <div class="chat">${msgs.map(m=>`<div class="msg ${m.direction}">${m.chunks?.length?m.chunks.map(c=>esc(c.text)).join('\n\n'):esc(m.body)}<span class="t">${m.direction==='out'?'→':'←'} ${fmt(m.created_at)} · ${m.status}</span></div>`).join('')||'<span class="mut sm">no messages yet</span>'}</div>
   <label>Message (blank line = new bubble)</label>
   <textarea id="msg_box" placeholder="hi dr sharma :)&#10;&#10;kaise hain aap?"></textarea>
   <div class="row" style="margin-top:6px">
     <button class="pri" onclick="sendChunks('${id}')">Send as chunks</button>
     <button onclick="logInbound('${id}')">Log received msg</button></div>
   <label>Send asset/demo</label>
   <div class="row">
     <select id="demo_type"><option value="video">demo video</option><option value="custom_blog">sample blog</option><option value="placard_sample">placard sample</option><option value="carousel_sample">carousel</option><option value="custom_site">mock site</option></select>
     <input id="demo_url" placeholder="url (optional)">
     <button class="sm pri" onclick="sendDemo('${id}')">Send</button></div>
   <label>Payment</label>
   <div class="row"><input id="pay_amt" type="number" placeholder="amount ₹"><select id="pay_type"><option>trial</option><option>annual</option><option>placard</option><option>setup</option></select>
   <button class="sm pri" onclick="logPayment('${id}')">Link sent</button></div>
   ${pays.length?`<div class="sm">${pays.map(p=>`<span class="pill ${p.status==='paid'?'ok':'mut'}">${esc(p.type)} ${INR(p.amount)} ${esc(p.status)}</span>`).join(' ')}</div>`:''}
   ${demos.length?`<div class="sm mut" style="margin-top:8px">demos: ${demos.length} · latest ${esc(demos[0]?.type)}</div>`:''}
   ${out.length?`<div class="sm mut">last outreach: D${out[0].day_no} v${out[0].variant} ${esc(out[0].status)} ${fmt(out[0].created_at)}</div>`:''}
   <label>Notes (facts I learned)</label><textarea id="lead_notes" style="min-height:60px">${esc(l.notes||'')}</textarea>
   <div class="row" style="margin-top:6px"><button class="sm pri" onclick="saveNotes('${id}')">Save notes</button>
   <button class="sm danger" onclick="escalate('${id}')">Escalate to boss</button>
   <button class="sm" onclick="markLost('${id}')">Mark lost</button></div>`);
}
window.openLead=openLead;
async function leadMap(){const ls=await sb('leads?select=*');window._leads=Object.fromEntries(ls.map(l=>[l.id,l]));return window._leads}
const v=id=>document.getElementById(id)?.value;
async function moveStage(id){const st=v('st_move');await sb(`leads?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({stage:st})});
  await sb('events',{method:'POST',body:JSON.stringify({type:'stage_moved',lead_id:id,payload:{to:st}})});toast('→ '+st);render();openLeadStale(id)}
async function saveNext(id){await sb(`leads?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({next_action:v('na_txt'),next_action_at:v('na_when')?new Date(v('na_when')).toISOString():null})});toast('next action saved');openLeadStale(id)}
async function saveNotes(id){await sb(`leads?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({notes:v('lead_notes')})});toast('notes saved')}
async function markLost(id){await sb(`leads?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({stage:'closed_lost'})});toast('marked lost');closeDrawer();render()}
async function sendChunks(id){
  const parts=v('msg_box').split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  if(!parts.length)return toast('nothing to send');
  const delay=[2,4,6].map((s,i)=>2+Math.floor(Math.random()*5));
  const chunks=parts.map((t,i)=>({text:t,delay_s:delay[i]||3}));
  const msg={lead_id:id,direction:'out',kind:'text',chunks,status:cfg.bridge?'queued':'sent'};
  const [m]=await sb('messages',{method:'POST',body:JSON.stringify(msg)});
  if(cfg.bridge){try{await fetch(cfg.bridge,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({type:'send_chunks',lead_id:id,messages:chunks,message_id:m.id})});toast('→ bridge')}catch(e){toast('bridge fail: saved as queued')}}
  else toast('saved (bridge not set)');
  await sb('events',{method:'POST',body:JSON.stringify({type:'msg_sent',lead_id:id,payload:{text:parts[0].slice(0,40)}})});
  openLeadStale(id);
}
async function logInbound(id){const b=prompt('What did they say?');if(!b)return;
  await sb('messages',{method:'POST',body:JSON.stringify({lead_id:id,direction:'in',kind:'text',body:b,status:'received'})});
  await sb(`leads?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({stage:'replied',score:50})});
  openLeadStale(id)}
async function sendDemo(id){const t=v('demo_type'),u=v('demo_url');
  await sb('demos',{method:'POST',body:JSON.stringify({lead_id:id,type:t,asset_url:u||null,title:t})});
  await sb('messages',{method:'POST',body:JSON.stringify({lead_id:id,direction:'out',kind:'text',body:`[${t}] ${u||'sent via WhatsApp'}`,status:'sent'})});
  await sb(`leads?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({stage:'demo_sent',score:70})});
  toast('demo sent');openLeadStale(id)}
async function logPayment(id){const a=+v('pay_amt'),t=v('pay_type');if(!a)return;
  await sb('payments',{method:'POST',body:JSON.stringify({lead_id:id,amount:a,type:t,status:'link_sent'})});
  toast('payment link logged');openLeadStale(id)}
async function escalate(id){const r=prompt('Why escalate? (pricing_exception/custom_request/angry/payment/other)')||'other';
  await sb('escalations',{method:'POST',body:JSON.stringify({lead_id:id,reason:'other',detail:r})});toast('boss alerted')}
function snooze(id,h){/* set next_action +1h */}
window.snooze=snooze;
function openLeadStale(id){leadMap().then(()=>openLead(id))}

/* ============ INBOX ============ */
async function viewInbox(){
  const [msgs,ls]=await Promise.all([sb('messages?select=*&order=created_at.desc&limit=120'),sb('leads?select=id,name,business,phone')]);
  const byLead={};msgs.forEach(m=>{(byLead[m.lead_id]=byLead[m.lead_id]||[]).push(m)});
  return Object.keys(byLead).length?Object.entries(byLead).map(([id,ms])=>{
    const l=ls.find(x=>x.id===id)||{};const last=ms[0];
    return `<div class="card click" style="margin-bottom:8px" onclick="openLead('${id}')">
      <div class="row"><b style="flex:2">${esc(l.business||l.name)}</b><span class="sm mut">${fmt(last.created_at)}</span></div>
      <div class="sm">${last.direction==='in'?'←':'→'} ${esc((last.chunks?.[0]?.text||last.body||'').slice(0,60))}</div></div>`}).join('')
    :'<span class="mut">No conversations yet. Sales tab → open a lead → chat.</span>';
}

/* ============ DELIVERY ============ */
async function viewDelivery(){
  const [as,ts]=await Promise.all([
    sb('assets?select=*,clients(name)&order=created_at.desc&limit=100'),
    sb('tickets?select=*,clients(name)&order=created_at.desc&limit=50')]);
  const cols=['draft','in_review','approved','published'];
  return `<div class="grid g2">
  <div class="card"><h2>Asset pipeline</h2>
   <div class="row sm" style="margin-bottom:8px">
     <select id="as_type"><option>blog</option><option>google_post</option><option>carousel</option><option>infographic</option><option>video</option><option>placard</option><option>report</option></select>
     <input id="as_title" placeholder="title">
     <select id="as_client">${window._clients?.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')||'<option value="">—</option>'}</select>
     <button class="sm pri" onclick="addAsset()">+</button></div>
   ${cols.map(c=>`<h3 class="sm mut" style="margin:10px 0 4px">${c} (${as.filter(a=>a.status===c).length})</h3>`+
     as.filter(a=>a.status===c).map(a=>`<div class="row sm" style="margin:4px 0;padding:6px;background:var(--card2);border-radius:8px">
       <div style="flex:2">[${esc(a.type)}] ${esc(a.title||'')} <span class="mut">· ${esc(a.clients?.name||'')}</span></div>

/* ============ VAULT ============ */
async function getPk(pass,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function encSecret(txt,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await getPk(pass,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(txt));
  return `v1:${b64(salt)}:${b64(iv)}:${b64(ct)}`;
}
async function decSecret(blob,pass){
  const [_,s,iv,ct]=blob.split(':');
  const k=await getPk(pass,ub64(s));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(iv)},k,ub64(ct));
  return new TextDecoder().decode(pt);
}
async function viewVault(){
  const cs=await sb('clients?select=id,name&order=name.asc');window._clients=cs;
  const vs=await sb('credentials?select=id,client_id,label,last_used_at,created_at&order=created_at.desc');
  return `<div class="grid g2"><div class="card"><h2>Add credential</h2>
    <label>Client</label><select id="vc_client">${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
    <label>Label <span class="sm">(e.g. "WordPress admin")</span></label><input id="vc_label">
    <label>Secret</label><input id="vc_secret" type="password">
    <label>Encryption passphrase <span class="sm">(stays in your head, never stored)</span></label><input id="vc_pass" type="password">
    <button class="pri" style="margin-top:10px" onclick="saveCred()">Encrypt & save</button>
    <p class="sm mut" style="margin-top:8px">AES-GCM in your browser. DB only holds ciphertext; passphrase never leaves this device. No one — not even a leaked DB dump — can read these without your passphrase.</p></div>
  <div class="card"><h2>Saved (${vs.length})</h2>
   ${vs.map(x=>`<div class="row sm" style="margin:6px 0;padding:6px;background:var(--card2);border-radius:8px">
     <div style="flex:2">🔒 ${esc(x.label)} <span class="mut">· ${esc(cs.find(c=>c.id===x.client_id)?.name||'—')}</span></div>
     <button class="sm" onclick="revealCred('${x.id}')">reveal</button></div>`).join('')}
   <div id="reveal_out" class="sm" style="margin-top:8px"></div></div></div>`;
}
async function saveCred(){
  if(!v('vc_secret')||!v('vc_pass'))return toast('need secret + passphrase');
  const blob=await encSecret(v('vc_secret'),v('vc_pass'));
  await sb('credentials',{method:'POST',body:JSON.stringify({client_id:v('vc_client'),label:v('vc_label'),secret_enc:blob})});
  v('vc_secret')='';v('vc_pass')='';toast('locked in 🔐');render();
}
async function revealCred(id){
  const pass=v('vc_pass')||prompt('Encryption passphrase to unlock:');if(!pass)return;
  try{const [c]=await sb(`credentials?id=eq.${id}&select=label,secret_enc`);
    const txt=await decSecret(c.secret_enc,pass);
    document.getElementById('reveal_out').innerHTML=`🔓 <b>${esc(c.label)}</b>: <code style="user-select:all">${esc(txt)}</code>`;
    await sb(`credentials?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({last_used_at:new Date().toISOString()})});
    v('vc_pass')=pass;
  }catch(e){document.getElementById('reveal_out').innerHTML='<span class="bad">wrong passphrase</span>'}
}

  document.getElementById('title').textContent='Client Portal';

     <input id="portal_code" placeholder="access code"><button class="pri" style="margin-top:10px;width:100%" onclick="portalLogin()">Login</button></div>`;
    return;
  }
  const [an,as,ts]=await Promise.all([
    rpc('client_analytics',{p_access:window._pAccess}),
    rpc('client_assets',{p_access:window._pAccess}),
    rpc('client_tickets',{p_access:window._pAccess})]);

  const blogs=(an||[]).reduce((s,a)=>s+ +(a.blogs_published||0),0);
  const maxT=Math.max(...(an||[]).map(a=>+(a.traffic_users||0)),1);
  app.innerHTML=`
  <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">
    <div class="card kpi"><b>${rev}</b><span>reviews in</span></div>
    <div class="card kpi"><b class="ok">${rep?Math.round(rep/rev*100):0}%</b><span>reply rate</span></div>
    <div class="card kpi"><b>${blogs}</b><span>blogs published</span></div>
  </div>
  <div class="card"><h2>Website traffic (daily users)</h2>
   ${(an||[]).slice(0,14).reverse().map(a=>`<div class="row sm" style="margin:3px 0"><span style="width:70px" class="mut">${a.day.slice(5)}</span><div class="bar" style="flex:1"><i style="width:${Math.round((a.traffic_users||0)/maxT*100)}%"></i></div><span style="width:40px;text-align:right">${a.traffic_users??'–'}</span></div>`).join('')||'<span class="mut sm">No data yet — first report lands after setup week.</span>'}</div>
  <div class="card" style="margin-top:12px"><h2>Delivered this month</h2>
   ${(as||[]).map(a=>`<div class="sm" style="margin:6px 0">📦 [${esc(a.type)}] <b>${esc(a.title||'')}</b> <span class="pill ${a.status==='published'?'ok':'warn'}">${esc(a.status)}</span>
   ${a.file_url?`<a href="${esc(a.file_url)}" target="_blank">open</a>`:''}</div>`).join('')||'<span class="mut sm">Assets appear here as they ship.</span>'}</div>
  <div class="card" style="margin-top:12px"><h2>Support</h2>

   <button class="pri" style="margin-top:8px" onclick="portalTicket()">Submit</button></div>
  <p class="sm mut" style="text-align:center;margin:16px 0">Powered by your growth team 🚀</p>`;

async function portalLogin(){const c=v('portal_code');
