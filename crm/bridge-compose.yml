# Coolify deploy shape for the WhatsApp reply bridge (lge-pilot-bridge).
# Env vars come from the Coolify application's env list (set via API) — the
# compose environment block is intentionally minimal to avoid interpolation
# collisions: only the state path (fixed) is declared here.
services:
  bridge:
    build:
      context: .
      dockerfile: bridge.Dockerfile
    container_name: lge-pilot-bridge
    restart: always
    environment:
      BRIDGE_STATE: /data/bridge_state.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bridge-state:/data

volumes:
  bridge-state: